name: Build Caddy + Cloudflare

on:
  schedule:
    - cron: '17 5 * * 6'
      timezone: 'America/Toronto'
  push:
    branches:
      - main
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: home-server-project/caddy-cloudflare

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./caddy-cloudflare
          file: ./caddy-cloudflare/Containerfile
          push: true
          pull: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Cloudflare DNS module
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:stable"
          docker pull "$IMAGE"
          docker run --rm --entrypoint caddy "$IMAGE" list-modules | grep -Fx 'dns.providers.cloudflare'

      - name: Summary
        run: |
          echo "### Built Caddy 2 + Cloudflare DNS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Published: ${REGISTRY}/${IMAGE_NAME}:stable" >> "$GITHUB_STEP_SUMMARY"
